name: terraform-plan (reusable)

# Runs WITHOUT a GitHub environment on purpose: environment protection rules
# (the prod approval) must gate apply only, never plan. Identity is therefore
# distinguished by OIDC subject (pull_request vs main), see bootstrap SQL.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      snowflake_user:
        type: string
        required: true
      ref:
        description: "Commit to check out. Empty = the commit that triggered the caller."
        type: string
        required: false
        default: ""
    outputs:
      exitcode:
        description: "0 = no changes, 2 = changes/drift"
        value: ${{ jobs.plan.outputs.exitcode }}

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/tf-init
        with:
          environment: ${{ inputs.environment }}
          snowflake_user: ${{ inputs.snowflake_user }}
          aws_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          snowflake_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
          snowflake_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: terraform plan
        id: plan
        working-directory: envs/${{ inputs.environment }}
        run: |
          set +e
          # -lock=false: the plan role is read-only on S3 and a plan never writes state.
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # Run-summary page: one collapsed block per environment, like the bot's PR comment. It is left open
          # only when the plan itself failed, so the error is visible without a click.
          result=$(grep -E '^(Plan:|No changes)' plan.txt | head -1)
          [ -n "$result" ] || result="no plan result, see the job log"
          open=""; [ "$code" = "1" ] && open=" open"
          {
            echo "<details$open><summary><b>${{ inputs.environment }}</b>: $result</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -ne 1 ]

      - uses: actions/upload-artifact@v7
        with:
          name: plan-${{ inputs.environment }}
          path: |
            envs/${{ inputs.environment }}/tfplan
            envs/${{ inputs.environment }}/plan.txt
          retention-days: 3
